name: Test get_started example
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: 
  actions: read
  security-events: write

jobs:
  build-and-run:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        compiler: [AC6, GCC, CLANG]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libtinfo6
          echo "LD_LIBRARY_PATH=${pythonLocation}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Activate vcpkg
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: "./vcpkg-configuration-workflow.json"

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - uses: ammaraskar/gcc-problem-matcher@master
        if: matrix.compiler == 'GCC'
      - name: Build
        run: |
          echo "Building get started example ..."
          cbuild get_started.csolution.yml --packs --update-rte --active Corstone-300-FVP --toolchain ${{ matrix.compiler }}

      - name: Execute
        run: |
          echo "Running get started example ..."
          ext=""
          case "${{ matrix.compiler }}" in
            AC6) ext="axf" ;;
            GCC) ext="elf";;
            CLANG) ext="elf" ;;
          esac
          FVP_Corstone_SSE-300 --simlimit 10 -f fvp-config.txt -a out/hello/Corstone-300-FVP/debug/hello.${ext} | tee model.log
          echo "Checking output..."
          grep "Hello World" model.log | wc -l
          test "$(grep "Hello World" model.log | wc -l)" -ge 3
